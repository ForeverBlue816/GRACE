name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: >-
          python -m compileall -q
          qwen-vl-finetune/qwenvl
          qwen-vl-finetune/scripts/deploy_awq_qwen.py
      - name: Check release entry points
        run: python -m unittest discover -s tests -v
